backend:
  name: github
  repo: michalgazda/annamatejska.pl
  branch: main
  base_url: https://annamatejska-decap-oauth.michalgazda.workers.dev
  auth_endpoint: /auth

site_url: https://michalgazda.github.io/annamatejska.pl/
display_url: https://michalgazda.github.io/annamatejska.pl/

# Repo upload location vs. URL used by the image widget preview. This project is
# hosted under the GH Pages project prefix, so public_folder must include it.
# Existing and new image-field values will be /annamatejska.pl/images/…; Astro's
# assetPath() normalizes both those and older "images/…" values.
media_folder: "public/images"
public_folder: "/annamatejska.pl/images"

publish_mode: editorial_workflow

collections:
  - name: "galleries"
    label: "Galerie"
    label_singular: "Galeria"
    description: "Sesje zdjęciowe pokazane w zakładce Galerie. Zdjęcia wgraj przez bibliotekę multimediów (przycisk „Media”)."
    files:
      - name: "galleries-registry"
        label: "Wszystkie galerie"
        file: "src/data/galleries.json"
        fields:
          - label: "Galerie"
            name: "galleries"
            widget: "list"
            summary: "{{fields.title}} ({{fields.date}})"
            add_to_top: true
            fields:
              - label: "Slug (adres URL, np. sesja-rodzinna-wawel)"
                name: "slug"
                widget: "string"
                pattern: ["^[a-z0-9-]+$", "małe litery, cyfry i myślniki"]
              - { label: "Tytuł", name: "title", widget: "string" }
              - label: "Kategoria"
                name: "category"
                widget: "select"
                options:
                  - "Sesje rodzinne"
                  - "Sesje dziecięce"
                  - "Sesje kobiece"
                  - "Sesje ciążowe"
                  - "Sesje romantyczne"
                  - "Sesje wizerunkowe"
              - { label: "Data", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
              - label: "Okładka (zdjęcie na kafelek)"
                name: "cover"
                widget: "image"
                required: false
              - { label: "Krótki opis", name: "excerpt", widget: "text" }
              - { label: "Liczba zdjęć w galerii", name: "photos", widget: "number", min: 1, max: 30, default: 6,
                  required: false, hint: "Używane tylko, gdy poniżej nie ma listy zdjęć." }
              - label: "Zdjęcia w galerii (wgrywane przez Media)"
                name: "photos_list"
                widget: "list"
                required: false
                hint: "Wgraj zdjęcia do biblioteki Media, potem dodaj je tu po kolei. Jeśli puste, strona użyje zdjęć z folderu images/galleries/<slug>/."
                field: { label: "Zdjęcie", name: "image", widget: "image" }

  - name: "testimonials"
    label: "Opinie"
    label_singular: "Opinia"
    files:
      - name: "testimonials-list"
        label: "Opinie klientek i klientów"
        file: "src/data/testimonials.json"
        fields:
          - label: "Opinie"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.author}}"
            add_to_top: true
            fields:
              - { label: "Treść opinii", name: "quote", widget: "text" }
              - { label: "Autor", name: "author", widget: "string" }

  - name: "services"
    label: "Oferta (sesje)"
    label_singular: "Sesja"
    editor:
      preview: false
    files:
      - name: "services-list"
        label: "Oferta — rodzaje sesji"
        file: "src/data/services.json"
        fields:
          - label: "Sesje"
            name: "services"
            widget: "list"
            summary: "{{fields.title}} ({{fields.duration}})"
            fields:
              - { label: "Slug (adres, np. rodzinne)", name: "slug", widget: "string",
                  pattern: ["^[a-z0-9-]+$", "małe litery, cyfry i myślniki"] }
              - { label: "Nazwa kategorii", name: "category", widget: "string", required: false }
              - { label: "Tytuł (nagłówek strony)", name: "title", widget: "string" }
              - { label: "Dopisek (np. Kraków i okolice)", name: "tagline", widget: "string", default: "Kraków i okolice", required: false }
              - { label: "Podtytuł (lead na górze strony)", name: "subtitle", widget: "text" }
              - { label: "Opis (akapity)", name: "description", widget: "list",
                  field: { label: "Akapit", name: "paragraph", widget: "text" } }
              - { label: "Czas trwania", name: "duration", widget: "string" }
              - { label: "Zawsze w cenie (punkty rozdzielone •)", name: "included", widget: "text" }
              - { label: "Opinia klienta (cytat + autor)", name: "quote", widget: "text", required: false }
              - { label: "Tytuł kafelka na stronie głównej", name: "card_title", widget: "string" }
              - { label: "Krótki tekst kafelka", name: "card_short", widget: "text" }
              - { label: "Czas na kafelku", name: "card_time", widget: "string" }
              - { label: "Zdjęcie kafelka", name: "card_image", widget: "image", required: false }
              - { label: "Widoczna w ofercie", name: "enabled", widget: "boolean", default: true }

  - name: "kadrowania"
    label: "Kadrowania"
    label_singular: "Kadr"
    description: "Portfolio podstrony Kadrowania (fotografia wydarzeń, architektury i podróży). Zdjęcia wgraj przez bibliotekę „Media”."
    editor:
      preview: false
    files:
      - name: "kadrowania-portfolio"
        label: "Portfolio — kadry"
        file: "src/data/kadrowania.json"
        fields:
          - label: "Kategorie (kolejne = kolejność na stronie)"
            name: "categories"
            widget: "list"
            field: { label: "Nazwa kategorii", name: "category", widget: "string" }
          - label: "Kadry"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} ({{fields.cat}})"
            fields:
              - label: "Kategoria"
                name: "cat"
                widget: "select"
                options: ["wydarzenia", "architektura", "podroze"]
              - { label: "Podpis kadru", name: "title", widget: "string" }
              - { label: "Szerszy kafelek", name: "wide", widget: "boolean", default: false, required: false }
              - label: "Zdjęcie (wgrane przez Media)"
                name: "image"
                widget: "image"
                required: false
                hint: "Jeśli puste, strona użyje domyślnego zdjęcia z folderu kadrowania wg kolejności w kategorii."

  - name: "home"
    label: "Strona główna"
    label_singular: "Blok strony głównej"
    description: "Krótki opis „O mnie” na stronie głównej oraz jego zdjęcie i podpisy."
    editor:
      preview: false
    files:
      - name: "home-about"
        label: "Strona główna — blok „O mnie”"
        file: "src/data/home.json"
        fields:
          - label: "O mnie (strona główna)"
            name: "about"
            widget: "object"
            fields:
              - { label: "Etykieta nad nagłówkiem", name: "kicker", widget: "string", default: "O mnie" }
              - { label: "Nagłówek (czcionka pisana)", name: "script_heading", widget: "string" }
              - label: "Akapity"
                name: "paragraphs"
                widget: "list"
                field: { label: "Akapit", name: "paragraph", widget: "text" }
              - { label: "Podpis (czcionka pisana)", name: "signature", widget: "string", default: "Anna" }
              - { label: "Zdjęcie", name: "photo", widget: "image" }
              - { label: "Tekst przycisku", name: "button_label", widget: "string", default: "Zobacz moje galerie" }
              - { label: "Adres przycisku", name: "button_url", widget: "string", default: "/annamatejska.pl/galerie" }

  - name: "about_page"
    label: "Strona „O mnie”"
    label_singular: "Sekcja"
    description: "Treść podstrony /o-mnie/ — dłuższa historia i sekcje tematyczne."
    editor:
      preview: false
    files:
      - name: "about-page"
        label: "Podstrona O mnie"
        file: "src/data/o-mnie.json"
        fields:
          - { label: "Etykieta nad nagłówkiem", name: "kicker", widget: "string", default: "O mnie" }
          - { label: "Tytuł strony", name: "title", widget: "string" }
          - { label: "Nagłówek (czcionka pisana)", name: "script_heading", widget: "text" }
          - { label: "Zdjęcie", name: "photo", widget: "image" }
          - { label: "Wstęp", name: "intro", widget: "text" }
          - label: "Sekcje"
            name: "sections"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Nagłówek sekcji", name: "title", widget: "string" }
              - label: "Akapity"
                name: "paragraphs"
                widget: "list"
                field: { label: "Akapit", name: "paragraph", widget: "text" }
          - { label: "Nagłówek zaproszenia do kontaktu", name: "cta_title", widget: "string" }
          - { label: "Tekst zaproszenia do kontaktu", name: "cta_text", widget: "text" }

  - name: "oferta"
    label: "Oferta i cennik"
    label_singular: "Pakiet"
    description: "Pakiety i ceny pokazywane w zakładce Oferta."
    editor:
      preview: false
    files:
      - name: "oferta-prices"
        label: "Pakiety sesji i ceny"
        file: "src/data/oferta.json"
        fields:
          - { label: "Etykieta nad nagłówkiem", name: "kicker", widget: "string", default: "Oferta" }
          - { label: "Nagłówek strony", name: "title", widget: "string" }
          - { label: "Wstęp", name: "intro", widget: "text" }
          - label: "Grupy pakietów"
            name: "groups"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Nazwa grupy", name: "name", widget: "string" }
              - { label: "Dopisek pod nazwą", name: "subtitle", widget: "string", required: false }
              - label: "Pakiety"
                name: "packages"
                widget: "list"
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { label: "Nazwa pakietu (np. MINI)", name: "name", widget: "string" }
                  - { label: "Cena (np. 500 zł)", name: "price", widget: "string" }
                  - label: "Co zawiera"
                    name: "features"
                    widget: "list"
                    field: { label: "Punkt", name: "feature", widget: "text" }
              - { label: "Przypis pod tabelą", name: "note", widget: "string", required: false }
          - { label: "Nagłówek listy „w cenie”", name: "included_title", widget: "string" }
          - label: "Cena sesji zawiera również"
            name: "included"
            widget: "list"
            field: { label: "Punkt", name: "point", widget: "string" }
          - label: "Oferta indywidualna"
            name: "custom"
            widget: "object"
            fields:
              - { label: "Nagłówek", name: "title", widget: "string" }
              - label: "Pytania"
                name: "questions"
                widget: "list"
                field: { label: "Pytanie", name: "question", widget: "string" }
              - { label: "Tekst", name: "text", widget: "text" }
          - label: "Reportaże"
            name: "reportaze"
            widget: "object"
            fields:
              - { label: "Nagłówek", name: "title", widget: "string" }
              - { label: "Dopisek", name: "subtitle", widget: "string" }
              - label: "Akapity"
                name: "paragraphs"
                widget: "list"
                field: { label: "Akapit", name: "paragraph", widget: "text" }
              - label: "Pakiety reportażowe"
                name: "packages"
                widget: "list"
                summary: "{{fields.name}} — {{fields.price}}"
                fields:
                  - { label: "Nazwa", name: "name", widget: "string" }
                  - { label: "Cena", name: "price", widget: "string" }
          - { label: "Tekst o pozostałej ofercie", name: "products_note", widget: "text", required: false }

  - name: "reportaze"
    label: "Reportaże"
    label_singular: "Reportaż"
    description: "Treść podstrony /reportaze/ — rodzaje wydarzeń i lista realizacji."
    editor:
      preview: false
    files:
      - name: "reportaze-page"
        label: "Podstrona Reportaże"
        file: "src/data/reportaze.json"
        fields:
          - { label: "Etykieta nad nagłówkiem", name: "kicker", widget: "string", default: "Reportaże" }
          - { label: "Nagłówek strony", name: "title", widget: "string" }
          - { label: "Wstęp", name: "intro", widget: "text" }
          - label: "Reportaże — uroczystości rodzinne"
            name: "family"
            widget: "list"
            field: { label: "Punkt", name: "item", widget: "string" }
          - label: "Wydarzenia społeczne i komercyjne"
            name: "events"
            widget: "list"
            field: { label: "Punkt", name: "item", widget: "string" }
          - label: "Grupy realizacji"
            name: "groups"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Nagłówek grupy", name: "title", widget: "string" }
              - label: "Realizacje"
                name: "items"
                widget: "list"
                field: { label: "Nazwa realizacji", name: "item", widget: "string" }
          - label: "Opinie"
            name: "testimonials"
            widget: "list"
            summary: "{{fields.author}}"
            fields:
              - { label: "Treść opinii", name: "quote", widget: "text" }
              - { label: "Autor", name: "author", widget: "string" }

  - name: "settings"
    label: "Ustawienia"
    editor:
      preview: false
    files:
      - name: "site-data"
        label: "Dane kontaktowe i social media"
        file: "src/data/site.json"
        fields:
          - { label: "Imię i nazwisko", name: "name", widget: "string" }
          - { label: "Telefon (wyświetlany)", name: "phoneDisplay", widget: "string" }
          - { label: "Telefon (międzynarodowy, +48…)", name: "phoneIntl", widget: "string" }
          - { label: "Telefon link (tel:+48…)", name: "phoneHref", widget: "string" }
          - { label: "E-mail", name: "email", widget: "string" }
          - label: "Instagram"
            name: "instagram"
            widget: "object"
            fields:
              - { label: "Nazwa profilu", name: "handle", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - label: "Facebook"
            name: "facebook"
            widget: "object"
            fields:
              - { label: "Nazwa profilu", name: "handle", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
          - { label: "Obszar działania", name: "area", widget: "string" }
          - { label: "Studio", name: "studio", widget: "string" }
