server {
    listen 80;
    server_name annamatejska.pl www.annamatejska.pl _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css text/html text/plain application/javascript application/json;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS only takes effect over TLS; meaningful when served behind a TLS-terminating reverse proxy
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' https://js.hcaptcha.com; font-src 'self'; connect-src 'self' https://api.web3forms.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://api.web3forms.com;" always;

    autoindex off;

    # Decap CMS admin needs eval + GitHub API/connect; keep the strict CSP for
    # the public site and relax only under /admin/
    location /admin/ {
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval' https://js.hcaptcha.com; font-src 'self'; connect-src 'self' https://api.github.com https://api.web3forms.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://api.web3forms.com;" always;
        try_files $uri $uri/ =404;
    }

    # Legacy: old links to the GH Pages project path. The site now lives at the
    # domain root; anything still pointing at /annamatejska.pl/… is redirected.
    location ~ ^/annamatejska\.pl/(?<legacy>.*)$ {
        return 301 /$legacy;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}