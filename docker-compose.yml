services:
  web:
    build: .
    container_name: annamatejska-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8890:80"
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3