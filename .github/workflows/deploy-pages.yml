name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build with Astro
        run: npm run build
      - name: Validate dist output
        run: npm run validate
      - name: Dependency audit (non-blocking)
        run: npm audit --omit=dev || true
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub twardo ogranicza ten timeout do 10 minut (większa wartość jest
          # przycinana z ostrzeżeniem), dlatego nie da się „wydłużyć” wdrożenia.
          error_count: 20

      # GitHub Pages potrafi zawiesić wdrożenie i dobić do limitu 10 minut, podczas gdy
      # udane wdrożenie tego samego dist trwa ~12 s — to po stronie GitHuba, nie rozmiaru.
      # Ponawiamy raz: druga próba praktycznie zawsze przechodzi.
      - name: Deploy to GitHub Pages (ponowienie po zawieszeniu)
        if: failure() && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          error_count: 20